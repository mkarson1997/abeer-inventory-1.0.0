[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abeer-inventory"
version = "1.0.0"
description = "A secure multilingual open-source inventory manager for small teams and shops."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Abeer / Team"}]
dependencies = [
  "Flask>=3.1.3,<4",
  "Pillow>=11.3,<13",
  "openpyxl>=3.1.5,<4",
  "reportlab>=4.4,<5",
  "arabic-reshaper>=3.0.0,<4",
  "python-bidi>=0.6.6,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff==0.16.2",
]
prod = ["gunicorn>=23,<24; platform_system != 'Windows'"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["abeer_inventory*"]

[tool.setuptools.package-data]
abeer_inventory = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Correctness-first rules for CI. Formatting can be handled separately without blocking releases.
select = ["E9", "F63", "F7", "F82"]
