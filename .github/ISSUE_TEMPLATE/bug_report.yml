name: Bug report
description: Report a reproducible Abeer Inventory defect
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Abeer Inventory. Never upload real inventory databases, user credentials, customer data, session secrets, or private business records.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide exact steps using synthetic or redacted data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, browser, Docker/local setup, and relevant application version.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Logs and screenshots are welcome after removing sensitive values.
