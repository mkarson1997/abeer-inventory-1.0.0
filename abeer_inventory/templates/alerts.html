{% extends 'base.html' %}{% block content %}<div class="page-head"><h1>{{ t.alerts }}</h1></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>{{ t.products }}</th><th>{{ t.category }}</th><th>{{ t.quantity }}</th><th>{{ t.critical }}</th></tr></thead><tbody>{% for p in products %}<tr class="low-row"><td>{{ p.name }}</td><td>{{ p.category }}</td><td><strong>{{ p.quantity }}</strong></td><td>{{ p.critical_stock }}</td></tr>{% else %}<tr><td colspan="4" class="empty">{{ t.no_data }}</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
