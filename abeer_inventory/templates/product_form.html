{% extends 'base.html' %}{% block content %}<div class="page-head"><div><p class="eyebrow">PRODUCT</p><h1>{{ t.edit if product else t.new_product }}</h1></div></div><section class="panel"><form method="post" enctype="multipart/form-data" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="span-2">{{ t.products }}<input name="name" maxlength="160" required value="{{ product.name if product else '' }}"></label><label>{{ t.category }}<input name="category" maxlength="120" value="{{ product.category if product else '' }}"></label><label>{{ t.quantity }}<input type="number" min="0" name="quantity" required value="{{ product.quantity if product else 0 }}"></label><label>{{ t.price }}<input type="number" min="0" step="0.01" name="price" required value="{{ '%.2f'|format(product.price_minor/100) if product else '0.00' }}"></label><label>{{ t.currency }}<select name="currency">{% for c in ['TRY','USD','EUR'] %}<option value="{{ c }}" {% if (product.currency if product else 'TRY')==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label><label>{{ t.critical }}<input type="number" min="0" name="critical_stock" required value="{{ product.critical_stock if product else 5 }}"></label><label>{{ t.barcode }}<input name="barcode" maxlength="120" value="{{ product.barcode if product else '' }}"></label><label class="span-2">{{ t.image }}<input type="file" name="image" accept="image/png,image/jpeg,image/webp" data-image-input>{% if product and product.image_name %}<img class="preview" data-image-preview src="{{ url_for('inventory.uploaded_image', name=product.image_name) }}" alt="">{% else %}<img class="preview hidden" data-image-preview alt="">{% endif %}</label><div class="span-2 button-row"><button class="btn primary" type="submit">{{ t.save }}</button><a class="btn" href="{{ url_for('inventory.products') }}">{{ t.cancel }}</a></div></form></section>{% endblock %}
