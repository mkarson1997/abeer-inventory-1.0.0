{% extends 'base.html' %}{% block content %}<section class="auth-card"><div class="logo-large">ع</div><h1>{{ t.register }}</h1><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>{{ t.username }}<input name="username" minlength="3" maxlength="64" required></label><label>{{ t.password }}<input type="password" name="password" minlength="10" maxlength="256" required></label><button class="btn primary">{{ t.register }}</button></form><p><a href="{{ url_for('auth.login') }}">{{ t.login }}</a></p></section>{% endblock %}
