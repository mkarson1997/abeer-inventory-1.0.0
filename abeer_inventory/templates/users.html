{% extends 'base.html' %}{% block content %}<div class="page-head"><h1>{{ t.users }}</h1></div><section class="panel"><h2>{{ t.create_user }}</h2><form class="form-grid" method="post" action="{{ url_for('admin.create_user') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>{{ t.username }}<input name="username" minlength="3" maxlength="64" required></label><label>{{ t.password }}<input type="password" name="password" minlength="10" maxlength="256" required></label><label>{{ t.role }}<select name="role"><option>viewer</option><option>editor</option><option>admin</option></select></label><div class="align-end"><button class="btn primary">{{ t.create_user }}</button></div></form></section><section class="panel"><div class="table-wrap"><table><thead><tr><th>{{ t.username }}</th><th>{{ t.role }}</th><th>{{ t.active }}</th><th>{{ t.actions }}</th></tr></thead><tbody>{% for u in users %}<tr><td>{{ u.username }}</td><td colspan="3"><form class="inline-form" method="post" action="{{ url_for('admin.update_user', user_id=u.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><select name="role">{% for r in ['viewer','editor','admin'] %}<option value="{{ r }}" {% if u.role==r %}selected{% endif %}>{{ r }}</option>{% endfor %}</select><label class="check"><input type="checkbox" name="is_active" value="1" {% if u.is_active %}checked{% endif %}> {{ t.active }}</label><button class="btn tiny">{{ t.save }}</button></form></td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
