{% extends 'base.html' %}{% block content %}<div class="page-head"><h1>{{ t.adjust }} · {{ product.name }}</h1></div><section class="panel narrow"><p>{{ t.quantity }}: <strong>{{ product.quantity }}</strong></p><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>{{ t.delta }}<input type="number" name="delta" required placeholder="+10 / -3"></label><label>{{ t.reason }}<input name="reason" maxlength="250" placeholder="Sale, purchase, correction…"></label><button class="btn primary">{{ t.save }}</button></form></section>{% endblock %}
